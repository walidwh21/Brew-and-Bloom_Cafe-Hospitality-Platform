<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 110 100" fill="none" role="img" aria-label="Brew and Bloom">
  <defs>
    <linearGradient id="cup-body" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#ebe0d2"/>
    </linearGradient>
    <linearGradient id="coffee" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#6b4a38"/>
      <stop offset="100%" stop-color="#2c1810"/>
    </linearGradient>
    <linearGradient id="gold-rim" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b8894a"/>
      <stop offset="50%" stop-color="#f0d898"/>
      <stop offset="100%" stop-color="#b8894a"/>
    </linearGradient>
  </defs>

  <ellipse cx="55" cy="96" rx="36" ry="4" fill="#000" opacity="0.08"/>
  <ellipse cx="55" cy="94" rx="32" ry="3.5" stroke="#d4a373" stroke-width="2" fill="#faf6f0"/>

  <path d="M80 36 C94 33 99 48 94 60 C88 70 80 67 80 56" stroke="#d4a373" stroke-width="3" fill="none" stroke-linecap="round"/>

  <path d="M24 30 L19 78 C18 85 24 90 55 90 C86 90 92 85 91 78 L86 30 Z" fill="url(#cup-body)" stroke="#3b2a21" stroke-width="2.2" stroke-linejoin="round"/>
  <ellipse cx="55" cy="30" rx="31" ry="6" fill="url(#gold-rim)" stroke="#3b2a21" stroke-width="2"/>

  <ellipse cx="55" cy="35" rx="25" ry="5" fill="url(#coffee)"/>
  <path d="M30 36 C32 62 40 74 55 74 C70 74 78 62 80 36" fill="url(#coffee)"/>

  <!-- Name on cream part of cup — large & readable -->
  <text x="55" y="62" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3b2a21" letter-spacing="0.05em">MITHI</text>
  <text x="55" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-weight="700" fill="#3b2a21" letter-spacing="0.08em">MELODY</text>

  <path d="M33 38 L31 76 C30 82 36 83 37 77 L39 40 Z" fill="#fff" opacity="0.35"/>
